name: Tool / Feature Request
description: Suggest a new tool, capability, or improvement to an existing tool
title: "[Feature Request]: <short description>"
labels: ["feature-request"]
assignees: []
projects: []
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new MCP tool, an enhancement to an existing tool, or any other capability you would like to see in API Context Plugins.

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - New tool
        - Enhancement to an existing tool
        - Improvement to prompts or responses
        - IDE / integration support
        - Other
    validations:
      required: true

  - type: input
    id: tool_name
    attributes:
      label: Tool or feature name
      description: A short name for the tool or feature you are requesting.
      placeholder: e.g., code_review tool, improved error messages in ask
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that the plugin currently does not support well?
      placeholder: e.g., When I ask about error handling, the ask tool gives general advice but does not reference the SDK specific exception types.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the tool or feature you would like. How would it work? What would it return?
      placeholder: e.g., A new error_search tool that takes an error code or exception class name and returns the SDK documented error types and handling patterns.
    validations:
      required: true

  - type: textarea
    id: example_prompt
    attributes:
      label: Example prompt or usage (optional)
      description: Show how a developer would trigger or use this feature in their IDE.
      placeholder: e.g., "What does a PayPal OrdersValidationError look like and how do I catch it in TypeScript?"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How much would this improve your workflow?
      options:
        - Minor improvement
        - Significant improvement - would use this regularly
        - Blocking - core to my use case
    validations:
      required: true
